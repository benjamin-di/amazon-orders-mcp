name: CI

# The fleet branch's CI (benjamin-di fork): upstream's unit tests and lint, plus the keeper's tests. Upstream's
# own workflows (build.yml and others) run only for upstream's develop branch and pull requests.
on:
  push:
    branches: [fleet]
  pull_request:
    branches: [fleet]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
      - name: Install the locked dependencies, then the package
        run: |
          uv venv venv
          uv pip install --python venv/bin/python --no-deps -r fleet/requirements.lock
          uv pip install --python venv/bin/python --no-deps -e .
          uv pip install --python venv/bin/python pytest coverage flake8 flake8-pyproject pep8-naming mypy responses
      - name: Lint (upstream's make check) and the keeper
        run: |
          venv/bin/mypy amazonorders_mcp fleet/keeper.py fleet/server.py fleet/upstream.py
          venv/bin/flake8
      - name: Tests (upstream's and the keeper's)
        run: venv/bin/python -m pytest -q tests fleet/tests
